<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List with Palette Switcher</title>
  <style>
    :root {
      --bg-color: #fff;
      --text-color: #222;
      --accent: #007bff;
      --input-bg: #f9f9f9;
      --input-border: #ccc;
    }
    html, body {
      height: 100%;
    }
    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: Calibri;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background 0.4s, color 0.4s;
    }
    #main-container {
      width: 380px;
      height: 380px;
      background: rgba(191, 248, 252, 0.9);
      box-shadow: 0 2px 18px #0002;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      padding: 22px 26px;
      margin-bottom: 48px;
      position: relative;
    }
    @media (max-width: 480px) {
      #main-container {
        width: 95vw;
        height: 95vw;
        padding: 14px 8px;
      }
      #palette-switcher {
        width: 98vw;
      }
    }
    #todo-app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .input-row {
      display: flex;
      flex-direction: row;
      gap: 8px;
      margin-bottom: 16px;
    }
    #todo-input {
      flex: 1 1 auto;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid var(--input-border);
      border-radius: 5px;
      background: var(--input-bg);
      color: var(--text-color);
      outline: none;
      transition: border 0.2s;
    }
    #add-task-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    #add-task-btn:hover {
      background: #0056b3;
    }
    #todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
    }
    #todo-list li {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    #todo-list li:last-child { border-bottom: none; }
    #todo-list li.completed span {
      text-decoration: line-through;
      color: #aaa;
    }
    #todo-list li button {
      margin-left: auto;
      background: #db3131;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.98rem;
      transition: background 0.2s;
    }
    #todo-list li button:hover {
      background: #a51c1c;
    }
    /* Palette Switcher single horizontal scrollbar style */
    #palette-switcher {
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      margin: 0 auto 32px auto;
      width: 410px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) #f1f1f1;
    }
    #palette-switcher::-webkit-scrollbar {
      height: 7px;
    }
    #palette-switcher::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 5px;
    }
    #palette-switcher::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    #palette-switcher button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      margin: 0;
      transition: background 0.3s, box-shadow 0.2s;
      white-space: nowrap;
    }
    #palette-switcher button:hover {
      background: #0056b3;
      box-shadow: 0 0 0 2px #007bff22;
    }
    /* Dark Palette */
    body.palette-dark {
      --bg-color: #222930;
      --text-color: #e0e4ea;
      --accent: #2b90d9;
      --input-bg: #323a45;
      --input-border: #444;
    }
    body.palette-dark #main-container {
      background: rgba(83, 90, 96, 0.98);
    }
    /* Pastel Palette */
    body.palette-pastel {
      --bg-color: #fce4ec;
      --text-color: #563d7c;
      --accent: #ffd1dc;
      --input-bg: #fff0f6;
      --input-border: #fab8c4;
    }
    body.palette-pastel #main-container {
      background: rgba(250, 139, 176, 0.96);
    }
    body.palette-pastel #palette-switcher button,
    body.palette-pastel #add-task-btn {
      color: #563d7c;
    }
    body.palette-pastel #palette-switcher button:hover,
    body.palette-pastel #add-task-btn:hover {
      background: #f9bed6;
    }
    /* Solarized Palette */
    body.palette-solarized {
      --bg-color: #fdf6e3;
      --text-color: #4f2a05;
      --accent: #b58900;
      --input-bg: #eee8d5;
      --input-border: #93a1a1;
    }
    body.palette-solarized #main-container {
      background: rgba(243, 195, 119, 0.97);
    }
    body.palette-solarized #palette-switcher button,
    body.palette-solarized #add-task-btn {
      color: #e5eaec;
    }
    body.palette-solarized #palette-switcher button:hover,
    body.palette-solarized #add-task-btn:hover {
      background: #d2b200;
    }
    /* Forest Palette */
    body.palette-forest {
      --bg-color: #2c3e50;
      --text-color: #ecf0f1;
      --accent: #27ae60;
      --input-bg: #34495e;
      --input-border: #1abc9c;
    }
    body.palette-forest #main-container {
      background: rgba(80, 103, 82, 0.909);
    }
    body.palette-forest #palette-switcher button,
    body.palette-forest #add-task-btn {
      color: #ecf0f1;
    }
    body.palette-forest #palette-switcher button:hover,
    body.palette-forest #add-task-btn:hover {
      background: #1abc9c;
    }
    /* Night Palette */
    body.palette-night {
      --bg-color: #0b0c10;
      --text-color: #66fcf1;
      --accent: #45a29e;
      --input-bg: #1f2833;
      --input-border: #45a29e;
    }
    body.palette-night #main-container {
      background: rgba(58, 60, 66, 0.97);
    }
    body.palette-night #palette-switcher button,
    body.palette-night #add-task-btn {
      color: #66fcf1;
    }
    body.palette-night #palette-switcher button:hover,
    body.palette-night #add-task-btn:hover {
      background: #1f2833;
    }
  </style>
</head>
<body>
  <div id="main-container">
    <h1>To-Do List</h1>
    <div id="todo-app">
      <div class="input-row">
        <input id="todo-input" type="text" placeholder="Add a new task..." />
        <button id="add-task-btn">Add Task</button>
      </div>
      <ul id="todo-list"></ul>
    </div>
  </div>
  <div id="palette-switcher">
    <button data-palette="light">🌞</button>
    <button data-palette="dark">🌚</button>
    <button data-palette="pastel">🌸</button>
    <button data-palette="solarized">☀️</button>
    <button data-palette="forest">🌲 </button>
    <button data-palette="night">🌌</button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Palette switching logic
      const paletteSwitcher = document.getElementById("palette-switcher");
      function setPalette(paletteName) {
        document.body.classList.remove(
          "palette-light",
          "palette-dark",
          "palette-pastel",
          "palette-solarized",
          "palette-forest",
          "palette-night"
        );
        document.body.classList.add("palette-" + paletteName);
        localStorage.setItem("colorPalette", paletteName);
      }
      const savedPalette = localStorage.getItem("colorPalette") || "light";
      setPalette(savedPalette);
      paletteSwitcher.addEventListener("click", function(e) {
        if (e.target.tagName === "BUTTON") {
          const palette = e.target.getAttribute("data-palette");
          setPalette(palette);
        }
      });

      // To-do app logic
      const toDoInput = document.getElementById("todo-input");
      const addTaskBtn = document.getElementById("add-task-btn");
      const toDoList = document.getElementById("todo-list");

      let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      tasks.forEach(task => renderTask(task));

      addTaskBtn.addEventListener('click', () => {
        const taskText = toDoInput.value.trim();
        if (taskText === "") return;

        const newTask = {
          id: Date.now(),
          text: taskText,
          complete: false
        };

        tasks.push(newTask);
        saveTasks();
        renderTask(newTask);
        toDoInput.value = "";
      });

      function renderTask(task) {
        const li = document.createElement('li');
        li.setAttribute('data-id', task.id);
        if (task.complete) li.classList.add("completed");
        li.innerHTML = `
          <span>${task.text}</span>
          <button>Delete</button>
        `;

        li.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') return;
          task.complete = !task.complete;
          li.classList.toggle("completed");
          saveTasks();
        });

        li.querySelector('button').addEventListener("click", (e) => {
          e.stopPropagation();
          tasks = tasks.filter(t => t.id != task.id);
          li.remove();
          saveTasks();
        });

        toDoList.appendChild(li);
      }

      function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
      }
    });
  </script>
</body>
</html>
